name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Go format, vet, build, test
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      TOKENGATE_TEST_REDIS: localhost:6379
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "These files need gofmt:"
            echo "$out"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race ./...

  compose:
    name: Validate Docker Compose file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file (skipped until it exists)
        run: |
          if [ -f deploy/compose/docker-compose.yml ]; then
            docker compose -f deploy/compose/docker-compose.yml config -q
          else
            echo "No compose file yet, skipping."
          fi
