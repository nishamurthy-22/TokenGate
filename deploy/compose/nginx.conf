# Load balancer in front of the gateway replicas. "gateway" resolves to every
# replica's address when nginx starts, so restart nginx after scaling
# (make up does this).
worker_processes auto;

events {
  worker_connections 8192;
}

http {
  access_log off;

  upstream gateways {
    server gateway:8000;
    keepalive 128;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://gateways;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      # Stream tokens to the client as they arrive.
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 300s;
    }
  }
}
